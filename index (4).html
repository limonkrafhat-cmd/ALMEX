<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALMEX</title>
<style>
:root{color-scheme:dark;--bg:#06020f;--card:#150a2e;--card2:#201045;--line:#3d2578;--v:#9333ff;--v2:#c9a0ff;--g:linear-gradient(110deg,#6d28ff,#a24bff,#e040fb,#4f6bff,#6d28ff);--t:#f4f1ff;--m:#9a8fc0;--up:#8b5cff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t)}
body{background:var(--bg)}
#cv{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;padding:calc(env(safe-area-inset-top,0px) + 34px) 0 env(safe-area-inset-bottom,0px)}
.scr.on{display:flex}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--v2);outline-offset:2px}
/* intro */
#intro{flex-direction:column;align-items:center}
#intro h1{margin-top:22px;font-size:clamp(34px,7vw,64px);letter-spacing:.22em;font-weight:800;padding-left:.22em;background:linear-gradient(180deg,#fff,#b79bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #8b5cff88)}
#intro p{color:var(--m);margin-top:6px;font-size:15px}
.coin{position:absolute;top:calc(env(safe-area-inset-top,0px) + 50px);right:18px;width:64px;height:64px;perspective:500px}
.ci{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:sp 3.6s linear infinite}
.cf{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;color:#7a4a00;background:radial-gradient(circle at 30% 25%,#ffe59a,#f7931a 55%,#b86400);border:3px solid #ffd27a;box-shadow:0 0 22px #f7931a88;backface-visibility:hidden}
.cf.b{transform:rotateY(180deg)}
@keyframes sp{to{transform:rotateY(360deg)}}
#go{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:50%;transform:translateX(-50%);padding:14px 38px;border-radius:99px;background:var(--v);font-weight:700;font-size:17px;box-shadow:0 0 30px #8b5cffaa;opacity:0;pointer-events:none;transition:opacity .8s}
#go.on{opacity:1;pointer-events:auto}
/* forms */
.scr.f{align-items:center;justify-content:center;padding:16px;overflow:auto}
.box{width:100%;max-width:420px;margin:auto;background:#120a24ee;border:1px solid var(--line);border-radius:22px;padding:28px 24px;backdrop-filter:blur(8px)}
.box h2{font-size:24px;margin-bottom:6px}
.box .s{color:var(--m);font-size:14px;margin-bottom:20px}
.logo{font-weight:800;letter-spacing:.2em;color:var(--v2);margin-bottom:14px}
.m,.p{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:10px;font-weight:600}
.m:hover{border-color:var(--v)}
.m b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-size:14px}
.m i{font-style:normal;font-size:20px;width:26px;text-align:center}
.in{width:100%;padding:13px 14px;border-radius:12px;background:#0b0618;border:1px solid var(--line);margin-bottom:10px}
.in:focus{border-color:var(--v);outline:0}
.pri{width:100%;padding:14px;border-radius:14px;background:var(--v);font-weight:700;margin-top:4px}
.err{color:#ff8fb0;font-size:13px;min-height:18px;margin-bottom:6px}
.lnk{background:none;color:var(--m);width:100%;padding:10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:8px 14px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--v);border-color:var(--v)}
[hidden]{display:none!important}
/* app */
#app.on{display:grid;grid-template-columns:230px 1fr;background:rgba(6,2,15,.5)}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.side .logo{padding:0 12px;font-size:20px;margin-bottom:18px}
.nb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:none;color:var(--m);font-size:16px;font-weight:600;text-align:left}
.nb.on,.nb:hover{background:var(--card2);color:var(--t)}
.nb.on{box-shadow:inset 3px 0 var(--v)}
.bnav{display:none}
#main{overflow:auto;padding:22px 18px 40px}
.w{max-width:660px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#8b5cff,#3b1a8c)}
.av.big{width:84px;height:84px;font-size:32px}
.u{font-weight:700}.mu{color:var(--m);font-size:13px}
.pt{margin:12px 0;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.md{width:100%;max-height:420px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,#2b1166,#0e0620);display:grid;place-items:center;min-height:180px;color:var(--v2)}
.ac{display:flex;gap:10px;margin-top:12px}
.ac button{background:var(--card2);padding:8px 14px;border-radius:99px;color:var(--m);font-size:14px}
.ac button.on{color:#ff7aa8}
textarea.in{resize:none;min-height:70px}
.fl{padding:9px 14px;border-radius:99px;background:var(--card2);font-size:14px;cursor:pointer;color:var(--m)}
.sm{padding:9px 18px;border-radius:99px;background:var(--v);font-weight:700;font-size:14px}
.sm.g{background:var(--card2);color:var(--m)}
.cw{display:grid;grid-template-columns:300px 1fr;gap:14px;height:calc(100vh - 80px);max-width:960px;margin:auto}
.cl,.cb{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto}
.ci2{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;border-bottom:1px solid var(--line)}
.ci2:hover,.ci2.on{background:var(--card2)}
.cb{display:flex;flex-direction:column}
.ch{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.ms{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bb{max-width:75%;padding:10px 14px;border-radius:16px;background:var(--card2);line-height:1.4;word-break:break-word}
.bb.me{align-self:flex-end;background:var(--v)}
.cs{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.cs .in{margin:0}
.bk{display:none;background:none;font-size:22px}
.st{display:flex;gap:26px;margin-top:14px}.st b{display:block;font-size:20px}
@media(max-width:799px){
#app.on{grid-template-columns:1fr;grid-template-rows:1fr auto}
.side{display:none}
.bnav{display:flex;border-top:1px solid var(--line);background:#0d0720}
.bnav .nb{flex:1;flex-direction:column;gap:2px;padding:9px 4px;font-size:12px;border-radius:0;justify-content:center;align-items:center}
.bnav .nb.on{box-shadow:inset 0 3px var(--v);background:none}
.cw{grid-template-columns:1fr;height:calc(100vh - 160px)}
.cw.o .cl{display:none}.cw:not(.o) .cb{display:none}
.bk{display:block}
}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border-radius:12px;background:var(--card2);color:var(--m);font-weight:600}.tabs button.on{background:var(--v);color:var(--t)}
.m.off{opacity:.55}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.g2,.g3{display:grid;gap:10px;margin-bottom:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2 .in,.g3 .in{margin-bottom:0}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1;padding:11px;border-radius:12px;background:var(--card2);font-weight:700;color:var(--m)}.seg .L.on{background:#16c784;color:#04170f}.seg .S.on{background:#ea3943;color:#fff}
.pos{color:#16c784}.neg{color:#ea3943}
.tg{padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700}.tg.L{background:#16c78433;color:#16c784}.tg.S{background:#ea394333;color:#ea3943}
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(40% 35% at 20% 30%,#6d28ff77,transparent 70%),radial-gradient(35% 30% at 80% 18%,#e040fb55,transparent 70%),radial-gradient(45% 40% at 62% 85%,#3b52ff66,transparent 70%),radial-gradient(30% 30% at 10% 90%,#00c2ff33,transparent 70%);filter:blur(30px);animation:au 16s ease-in-out infinite alternate}
@keyframes au{0%{transform:translate(0,0) rotate(0) scale(1);filter:blur(30px) hue-rotate(0)}100%{transform:translate(5%,-4%) rotate(10deg) scale(1.12);filter:blur(30px) hue-rotate(45deg)}}
@keyframes sh{to{background-position:-300% 0}}
.pri,.sm:not(.g),#go,.chip.on,.tabs button.on,.bb.me{background-image:var(--g);background-size:300% 100%;animation:sh 9s linear infinite}
#intro h1{background-image:linear-gradient(90deg,#fff,#c9a0ff,#ff7ae6,#7aa2ff,#fff);background-size:300% 100%;animation:sh 7s linear infinite}
.av{background:linear-gradient(135deg,#a24bff,#4f3bff,#e040fb,#a24bff);background-size:300% 300%;animation:sh2 8s ease infinite}
@keyframes sh2{50%{background-position:100% 100%}}
.box{box-shadow:0 0 70px #9333ff33}.card{box-shadow:0 8px 30px #0006}
.ic{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.ic.s{width:16px;height:16px}
.nb span{display:grid}.nb .ic{opacity:.65}.nb.on .ic,.nb:hover .ic{opacity:1;filter:drop-shadow(0 0 6px #c9a0ff)}
.nb.on{box-shadow:inset 3px 0 #c9a0ff,0 0 18px #9333ff44}
.fl{display:inline-flex;gap:8px;align-items:center}div.md{display:flex;gap:10px;align-items:center;justify-content:center}
.tk{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:34px;z-index:50;overflow:hidden;display:flex;align-items:center;background:rgba(10,4,24,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);font-size:13px;font-weight:600;white-space:nowrap}
.tkt{display:flex;width:max-content;animation:tk 45s linear infinite}.tk:hover .tkt{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.ti{padding-right:30px}.ti b{margin-right:4px}.ti i{font-style:normal}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.tk{overflow-x:auto}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="tk" aria-label="Котировки"><div class="tkt" id="tkt"></div></div>

<section id="intro" class="scr on">
  <h1>ALMEX</h1>
  <p>Соцсеть трейдеров</p>
  <div class="coin"><div class="ci"><div class="cf">₿</div><div class="cf b">₿</div></div></div>
  <button id="go">Войти</button>
</section>

<section id="auth" class="scr f">
  <div class="box">
    <div class="logo">ALMEX</div>
    <h2>Вход в аккаунт</h2>
    <p class="s">Почта или телефон и пароль. Пароль не хранится в открытом виде.</p>
    <div class="tabs"><button id="tL" class="on">Вход</button><button id="tR">Регистрация</button></div>
    <button class="m off" id="gg"><b>G</b>Google · скоро</button>
    <input class="in" id="id" placeholder="Почта или телефон с кодом страны" autocomplete="username">
    <input class="in" id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <input class="in" id="pw2" type="password" placeholder="Повтори пароль" autocomplete="new-password" hidden>
    <div class="mu" id="hint" hidden style="margin-bottom:8px">Пароль: от 8 символов, буквы и цифры.</div>
    <div class="err" id="err"></div>
    <button class="pri" id="cont">Войти</button>
  </div>
</section>

<section id="setup" class="scr f">
  <div class="box">
    <div class="logo">ALMEX</div>
    <h2>Создай профиль</h2>
    <p class="s">Так тебя увидят другие трейдеры.</p>
    <input class="in" id="nm" placeholder="Имя" maxlength="30">
    <input class="in" id="un" placeholder="Никнейм, например alex_trade" maxlength="20">
    <input class="in" id="bio" placeholder="О себе в одной строке" maxlength="90">
    <div class="mu" style="margin-bottom:8px">Стиль торговли</div>
    <div class="chips" id="chips"></div>
    <div class="err" id="err2"></div>
    <button class="pri" id="mk">Создать аккаунт</button>
  </div>
</section>

<section id="app" class="scr">
  <aside class="side"><div class="logo">ALMEX</div><div id="sn"></div></aside>
  <main id="main"></main>
  <nav class="bnav" id="bn"></nav>
</section>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));introOn=id==='intro'}
let introOn=true;

/* ---------- фон и 3D-свечи ---------- */
const cv=$('#cv'),c=cv.getContext('2d');let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
const rnd=i=>{const x=Math.sin(i*127.1+11)*43758.5453;return x-Math.floor(x)};
const stars=Array.from({length:140},(_,i)=>({x:rnd(i),y:rnd(i+300),r:rnd(i+600)*1.4+.3,p:rnd(i+900)*6}));
const N=15;let raw=[],p=1;
for(let i=0;i<N;i++){const o=p,cl=o+(rnd(i)-.42)*1.3+.2;raw.push({o,cl,hi:Math.max(o,cl)+rnd(i+50)*.45,lo:Math.max(.2,Math.min(o,cl)-rnd(i+90)*.45)});p=cl}
const mx=Math.max(...raw.map(r=>r.hi)),mn=Math.min(...raw.map(r=>r.lo));
raw.forEach(r=>['o','cl','hi','lo'].forEach(k=>r[k]=(r[k]-mn)/(mx-mn)*7.5+.3));
const FACES=[[2,3,7,6,0,0],[0,1,3,2,0,-1],[4,5,7,6,0,1],[0,2,6,4,-1,0],[1,3,7,5,1,0]];
let A=.2,TL=.42,S,CX,CY;
function P(x,y,z){const X=x*Math.cos(A)+z*Math.sin(A),Z=-x*Math.sin(A)+z*Math.cos(A);
const Y=y*Math.cos(TL)+Z*Math.sin(TL),D=Z*Math.cos(TL)-y*Math.sin(TL),k=14/(14+D);return[CX+X*S*k,CY-Y*S*k,D]}
function box(b){const co=Math.cos(b.a),si=Math.sin(b.a),v=[];
for(let i=0;i<8;i++){const lx=i&1?b.w:-b.w,lz=i&4?b.w:-b.w;v.push(P(b.x+lx*co+lz*si,i&2?b.y1:b.y0,-lx*si+lz*co))}
const fs=FACES.map(f=>({f,z:(v[f[0]][2]+v[f[1]][2]+v[f[2]][2]+v[f[3]][2])/4})).sort((a,b)=>b.z-a.z);
for(const{f}of fs){const nx=f[4]*co+f[5]*si,nz=-f[4]*si+f[5]*co,sh=(f[4]||f[5])?Math.max(0,Math.min(.6,.3+.3*nz+.2*nx)):0;
c.beginPath();f.slice(0,4).forEach((i,j)=>j?c.lineTo(v[i][0],v[i][1]):c.moveTo(v[i][0],v[i][1]));c.closePath();
c.fillStyle=b.c;c.fill();if(sh){c.fillStyle='rgba(0,0,0,'+sh+')';c.fill()}c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=1;c.stroke()}}
const ease=x=>1-Math.pow(1-x,3),T0=performance.now();let ready=false;
function candles(t){S=Math.min(W*.92,H*.78)/17;CX=W/2;CY=H*.76;const L=[];
raw.forEach((r,i)=>{const g=ease(Math.max(0,Math.min(1,(t-.4-i*.22)/1.1)));if(g<=0)return;
const col=r.cl>=r.o?'#16c784':'#ea3943',x=(i-(N-1)/2)*1.05,a=t*.9+i*.8,y0=Math.min(r.o,r.cl)*g,y1=Math.max(Math.max(r.o,r.cl)*g,y0+.15),z=P(x,(y0+y1)/2,0)[2];
L.push({x,y0:r.lo*g,y1:r.hi*g,w:.06,c:col,a,z:z+.001});L.push({x,y0,y1,w:.34,c:col,a,z})});
L.sort((a,b)=>b.z-a.z).forEach(box)}
function frame(now){const t=(now-T0)/1000;c.clearRect(0,0,W,H);
for(const s of stars){c.globalAlpha=.25+.75*Math.abs(Math.sin(t*.8+s.p));c.fillStyle='#d9ccff';c.beginPath();c.arc(s.x*W,s.y*H,s.r,0,6.3);c.fill()}
c.globalAlpha=1;if(introOn){candles(t);if(!ready&&t>3.2){ready=true;$('#go').classList.add('on')}}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- котировки (снимок рынка на 13.11.2026) ---------- */
const TK=[['XAU/USD','3,877',-2.7],['EUR/USD','1.1050',-.1],['BTC/USD','68,300',-6.5],['ETH/USD','1,925',-5.8],['SOL/USD','80.05',-3.5],['NASDAQ','25,366',-.39],['S&P 500','7,593',-.35],['USD/JPY','159.88',-.1]];
const TKM={'BTC/USD':'BTCUSDT','ETH/USD':'ETHUSDT','SOL/USD':'SOLUSDT'};let live=false;
function tkDraw(){const row=`<span class="ti mu">${live?'● Крипто live, остальное снимок':'Снимок 13.11.2026'}</span>`+TK.map(([n,p,c])=>`<span class="ti"><b>${n}</b> ${p} <i class="${c<0?'neg':'pos'}">${c<0?'▼':'▲'} ${Math.abs(c).toFixed(2)}%</i></span>`).join('');$('#tkt').innerHTML=row+row}
tkDraw();
/* Живые цены: работают, когда файл открыт на обычном хостинге. В превью Claude соединение блокируется, и остаётся снимок. */
function tkLive(){try{const ws=new WebSocket('wss://stream.binance.com:9443/stream?streams=btcusdt@miniTicker/ethusdt@miniTicker/solusdt@miniTicker');let t=0;
ws.onmessage=e=>{const d=JSON.parse(e.data).data;if(!d)return;const r=TK.find(x=>TKM[x[0]]===d.s);if(!r)return;const c=+d.c;r[1]=c.toLocaleString('en-US',{maximumFractionDigits:c<100?2:0});r[2]=(c-d.o)/d.o*100;live=true;if(Date.now()-t>1000){t=Date.now();tkDraw()}};
ws.onclose=()=>{if(live)setTimeout(tkLive,3000)}}catch(e){}}
tkLive();

/* ---------- данные ---------- */
const LS={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let db=LS.g('almex_db',{}),ses=LS.g('almex_ses',null),me=null,jr=[];
const persist=()=>LS.s('almex_db',db);
const TABS=[['feed','home','Главная'],['jr','jr','Журнал'],['chat','chat','Чаты'],['fr','fr','Друзья'],['me','me','Профиль']];
const STY=['Скальпинг','Дейтрейдинг','Свинг','Инвестор','Крипто','Форекс'],EX=['Сделка открыта','Тейк-профит','Стоп-лосс','Безубыток','Закрыл вручную'];
let tab='feed',cur=null,pend=null,sel=new Set(),jdir='L',mode='L';
const posts=[
{n:'Айдар К.',u:'aidar_fx',t:'2 ч',x:'BTC удержал поддержку. Жду ретест и вход с коротким стопом, риск 1% на сделку.',m:'chart',l:0,c:12},
{n:'Мира Т.',u:'mira_trades',t:'5 ч',x:'Итоги недели: 7 сделок, 2 стопа, плюс по депозиту. Главный вывод: не торговать после обеда.',l:0,c:8},
{n:'Дан Р.',u:'dan_swing',t:'вчера',x:'Совет новичкам: журнал сделок важнее любого индикатора. Записывай причину входа и эмоции.',l:0,c:21}];
const people=[['Айдар К.','aidar_fx','Скальпинг, крипто'],['Мира Т.','mira_trades','Дейтрейдинг'],['Дан Р.','dan_swing','Свинг и акции'],['Сара Л.','sara_fx','Форекс'],['Тимур Б.','timur_btc','Инвестор']];
const chats=[{n:'Айдар К.',m:[['o','Привет! Видел твою идею по BTC.'],['o','Давай обсудим уровни?']]},{n:'Мира Т.',m:[['o','Скинь свой шаблон журнала']]},{n:'Клуб скальперов',m:[['o','Дан: сегодня волатильно, аккуратнее']]}];
const fr=new Set();

/* ---------- безопасный вход ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
const newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
function ident(v){v=v.trim().toLowerCase();if(v.includes('@'))return /^\S+@\S+\.\S+$/.test(v)?'e:'+v:null;const d=v.replace(/\D/g,'');return d.length>=10&&d.length<=15?'p:'+d:null}
function setMode(m){mode=m;$('#tL').classList.toggle('on',m==='L');$('#tR').classList.toggle('on',m==='R');$('#pw2').hidden=$('#hint').hidden=m==='L';
$('#cont').textContent=m==='L'?'Войти':'Создать аккаунт';$('#pw').autocomplete=m==='L'?'current-password':'new-password';$('#err').textContent=''}
$('#tL').onclick=()=>setMode('L');$('#tR').onclick=()=>setMode('R');
$('#gg').onclick=()=>$('#err').textContent='Вход через Google подключится вместе с сервером.';
$('#cont').onclick=async()=>{const E=t=>$('#err').textContent=t,id=ident($('#id').value),pw=$('#pw').value;
if(!id)return E('Введи корректную почту или телефон с кодом страны');
const f=LS.g('almex_f',{}),fl=f[id],recent=fl&&Date.now()-fl.t<60000;
if(recent&&fl.n>=5)return E('Слишком много попыток. Подожди минуту.');
try{
if(mode==='R'){if(db[id])return E('Такой аккаунт уже есть. Перейди на вкладку «Вход».');
if(pw.length<8||!/[a-zA-Zа-яА-Я]/.test(pw)||!/\d/.test(pw))return E('Пароль: от 8 символов, буквы и цифры');
if(pw!==$('#pw2').value)return E('Пароли не совпадают');
const sa=newSalt();db[id]={s:sa,h:await hash(pw,sa),p:null,j:[]};persist();ses=id;LS.s('almex_ses',id);$('#pw').value=$('#pw2').value='';show('setup')}
else{const a=db[id];if(!a||await hash(pw,a.s)!==a.h){f[id]={n:(recent?fl.n:0)+1,t:Date.now()};LS.s('almex_f',f);return E('Неверная почта, телефон или пароль')}
delete f[id];LS.s('almex_f',f);ses=id;LS.s('almex_ses',id);$('#pw').value='';a.p?open():show('setup')}
}catch(e){E('Не удалось выполнить вход. Открой страницу по защищённому адресу https.')}};
$('#go').onclick=()=>{if(ses&&db[ses])db[ses].p?open():show('setup');else show('auth')};
$('#chips').innerHTML=STY.map(s=>`<button class="chip" type="button">${s}</button>`).join('');
$$('#chips .chip').forEach(b=>b.onclick=()=>{const k=b.textContent;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('on')});
$('#mk').onclick=()=>{const n=$('#nm').value.trim(),u=$('#un').value.trim().toLowerCase();
if(!n)return $('#err2').textContent='Введи имя';
if(!/^[a-z0-9_]{3,20}$/.test(u))return $('#err2').textContent='Никнейм: 3–20 символов, латиница, цифры и _';
if(Object.values(db).some(x=>x.p&&x.p.u===u&&x!==db[ses]))return $('#err2').textContent='Этот никнейм занят';
db[ses].p={n,u,bio:$('#bio').value.trim(),st:[...sel],ph:''};persist();open()};
function open(){me=db[ses].p;jr=db[ses].j||[];show('app');go('feed')}

/* ---------- приложение ---------- */
function nav(){const h=TABS.map(t=>`<button class="nb ${t[0]===tab?'on':''}" data-t="${t[0]}"><span>${ic(t[1])}</span>${t[2]}</button>`).join('');
$('#sn').innerHTML=h;$('#bn').innerHTML=h;$$('.nb').forEach(b=>b.onclick=()=>go(b.dataset.t))}
function go(t){tab=t;cur=null;nav();render()}
const av=(n,c='',ph='')=>`<div class="av ${c}">${ph?`<img src="${ph}" alt="">`:esc(n[0]||'?').toUpperCase()}</div>`;
const ICO={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',jr:'<path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M9 8h6M9 12h6"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',fr:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 5"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',chart:'<path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/>'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24">${ICO[n]}</svg>`;
const fmt=n=>(n>0?'+':'')+Math.round(n*100)/100;
const V={
feed(){return `<div class="w"><div class="card"><div class="row" style="align-items:flex-start">${av(me.n,'',me.ph)}<div style="flex:1"><textarea class="in" id="ptxt" placeholder="Что на рынке, ${esc(me.n)}?"></textarea>
<div class="row" style="justify-content:space-between"><label class="fl">${ic('img','s')} Фото или видео<input type="file" id="pf" accept="image/*,video/*" hidden></label><span class="mu" id="pn">${pend?esc(pend.f.name):''}</span><button class="sm" data-a="post">Опубликовать</button></div></div></div></div>`+
posts.map((p,i)=>`<article class="card"><div class="row">${av(p.n,'',p.ph)}<div><div class="u">${esc(p.n)}</div><div class="mu">@${esc(p.u)} · ${p.t}</div></div></div>
<div class="pt">${esc(p.x)}</div>${p.m==='chart'?`<div class="md">${ic('chart')} График BTC</div>`:p.m?p.m:''}
<div class="ac"><button class="${p.l?'on':''}" data-a="like" data-i="${i}">${p.l?'♥':'♡'} ${p.c+(p.l?1:0)}</button><button>${ic('chat','s')} Комментарии</button></div></article>`).join('')+`</div>`},
jr(){const cl=jr.filter(t=>t.res!==''),win=cl.filter(t=>t.res>0).length,sum=cl.reduce((a,t)=>a+t.res,0);
return `<div class="w"><div class="mu" style="margin-bottom:12px">${ic('lock','s')} Журнал виден только тебе</div>
<div class="card"><div class="u" style="margin-bottom:12px">Новая сделка</div>
<div class="g2"><input class="in" id="jsym" placeholder="Инструмент, например BTCUSDT" maxlength="14"><select class="in" id="jtf">${['M5','M15','H1','H4','D1'].map(x=>`<option>${x}</option>`).join('')}</select></div>
<div class="seg"><button class="L ${jdir==='L'?'on':''}" data-a="dir" data-i="L">Лонг</button><button class="S ${jdir==='S'?'on':''}" data-a="dir" data-i="S">Шорт</button></div>
<div class="g3"><input class="in" id="jen" type="number" step="any" placeholder="Вход"><input class="in" id="jsl" type="number" step="any" placeholder="Стоп-лосс"><input class="in" id="jtp" type="number" step="any" placeholder="Тейк-профит"></div>
<div class="g2"><input class="in" id="jrk" type="number" step="any" placeholder="Риск, % депозита"><input class="in" id="jrs" type="number" step="any" placeholder="Результат, %"></div>
<textarea class="in" id="jwhy" placeholder="Почему зашёл: сетап, уровень, подтверждение"></textarea>
<select class="in" id="jex">${EX.map(x=>`<option>${x}</option>`).join('')}</select>
<textarea class="in" id="jnt" placeholder="Причина выхода, эмоции, что улучшить"></textarea>
<div class="err" id="jerr"></div><button class="pri" data-a="jadd">Записать сделку</button></div>
<div class="card row" style="justify-content:space-around;text-align:center"><div><b style="font-size:20px">${jr.length}</b><div class="mu">сделок</div></div><div><b style="font-size:20px">${cl.length?Math.round(win/cl.length*100):0}%</b><div class="mu">винрейт</div></div><div><b style="font-size:20px" class="${sum>0?'pos':sum<0?'neg':''}">${fmt(sum)}%</b><div class="mu">итог</div></div></div>`+
(jr.length?jr.map((t,i)=>{const rr=t.sl!==''&&t.tp!==''&&t.en!==''&&t.en!==t.sl?Math.abs(t.tp-t.en)/Math.abs(t.en-t.sl):0;
return `<div class="card"><div class="row" style="justify-content:space-between"><div class="u">${esc(t.sym)} <span class="tg ${t.dir}">${t.dir==='L'?'Лонг':'Шорт'}</span> <span class="mu">${t.tf}</span></div><div class="u ${t.res>0?'pos':t.res<0?'neg':''}">${t.res===''?'открыта':fmt(t.res)+'%'}</div></div>
<div class="mu" style="margin:6px 0">${new Date(t.d).toLocaleDateString('ru')}${t.en!==''?' · вход '+t.en:''}${t.sl!==''?' · стоп '+t.sl:''}${t.tp!==''?' · тейк '+t.tp:''}${t.rk!==''?' · риск '+t.rk+'%':''}${rr?' · R:R 1:'+rr.toFixed(1):''}</div>
${t.why?`<div class="pt"><b>Вход:</b> ${esc(t.why)}</div>`:''}<div class="pt" style="margin-top:0"><b>Выход:</b> ${esc(t.ex)}${t.nt?' — '+esc(t.nt):''}</div>
<div class="ac"><button data-a="jdel" data-i="${i}">Удалить</button></div></div>`}).join(''):'<div class="card mu">Сделок пока нет. Запиши первую: причину входа, стоп, тейк и итог.</div>')+`</div>`},
chat(){const ch=cur!=null?chats[cur]:null;
return `<div class="cw ${ch?'o':''}"><div class="cl">${chats.map((x,i)=>`<div class="ci2 ${i===cur?'on':''}" data-a="chat" data-i="${i}">${av(x.n)}<div><div class="u">${esc(x.n)}</div><div class="mu">${esc(x.m[x.m.length-1][1]).slice(0,34)}</div></div></div>`).join('')}</div>
<div class="cb">${ch?`<div class="ch"><button class="bk" data-a="back">←</button>${av(ch.n)}<div class="u">${esc(ch.n)}</div></div><div class="ms" id="ms">${ch.m.map(m=>`<div class="bb ${m[0]==='me'?'me':''}">${esc(m[1])}</div>`).join('')}</div>
<div class="cs"><input class="in" id="cin" placeholder="Сообщение" autocomplete="off"><button class="sm" data-a="send">Отправить</button></div>`:'<div class="ms" style="place-content:center;text-align:center;color:var(--m)">Выбери чат слева</div>'}</div></div>`},
fr(){return `<div class="w"><input class="in" id="fs" placeholder="Найти трейдера по имени или нику">`+people.map((p,i)=>`<div class="card row fc" data-q="${esc((p[0]+p[1]).toLowerCase())}">${av(p[0])}<div style="flex:1"><div class="u">${p[0]}</div><div class="mu">@${p[1]} · ${p[2]}</div></div><button class="sm ${fr.has(i)?'g':''}" data-a="fr" data-i="${i}">${fr.has(i)?'В друзьях':'Добавить'}</button></div>`).join('')+`</div>`},
me(){const mine=posts.filter(p=>p.u===me.u).length;return `<div class="w"><div class="card"><div class="row">${av(me.n,'big',me.ph)}<div><div class="u" style="font-size:22px">${esc(me.n)}</div><div class="mu">@${esc(me.u)}</div><label class="fl" style="display:inline-block;margin-top:8px">${ic('img','s')} Фото профиля<input type="file" id="pph" accept="image/*" hidden></label></div></div>
<div class="st"><div><b>${mine}</b><span class="mu">постов</span></div><div><b>${fr.size}</b><span class="mu">друзей</span></div><div><b>${jr.length}</b><span class="mu">сделок</span></div></div></div>
<div class="card"><div class="u" style="margin-bottom:12px">Настройки аккаунта</div><input class="in" id="enm" value="${esc(me.n)}" maxlength="30" placeholder="Имя"><input class="in" id="ebio" value="${esc(me.bio||'')}" maxlength="90" placeholder="О себе">
<div class="chips" id="ech">${STY.map(s=>`<button class="chip ${me.st.includes(s)?'on':''}" data-a="est" data-i="${s}">${s}</button>`).join('')}</div><div class="err" id="eok"></div><button class="pri" data-a="psave">Сохранить</button></div>
<button class="sm g" data-a="out" style="width:100%;padding:14px">Выйти из аккаунта</button></div>`}};
function render(){const v=$('#ptxt')?.value;$('#main').innerHTML=V[tab]();if(v)$('#ptxt').value=v;
const m=$('#ms');if(m)m.scrollTop=m.scrollHeight}
function photo(f){const im=new Image();im.onload=()=>{const z=256,k=document.createElement('canvas');k.width=k.height=z;const m=Math.min(im.width,im.height);
k.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);me.ph=k.toDataURL('image/jpeg',.85);persist();URL.revokeObjectURL(im.src);render()};im.src=URL.createObjectURL(f)}
const A_={
post(){const x=$('#ptxt').value.trim();if(!x&&!pend)return;let m='';
if(pend){m=pend.f.type.startsWith('video')?`<video class="md" src="${pend.u}" controls playsinline></video>`:`<img class="md" src="${pend.u}" alt="">`}
posts.unshift({n:me.n,u:me.u,ph:me.ph,t:'сейчас',x,m,l:0,c:0});pend=null;$('#ptxt').value='';render()},
like(i){posts[i].l=posts[i].l?0:1;render()},
chat(i){cur=+i;render()},back(){cur=null;render()},
send(){const i=$('#cin').value.trim();if(!i)return;chats[cur].m.push(['me',i]);render();$('#cin').focus()},
fr(i){fr.has(+i)?fr.delete(+i):fr.add(+i);render()},
dir(i){jdir=i;$$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.i===i))},
jadd(){const g=id=>$(id).value,n=id=>g(id)===''?'':+g(id),sym=g('#jsym').trim().toUpperCase();
if(!sym)return $('#jerr').textContent='Укажи инструмент';
jr.unshift({sym,tf:g('#jtf'),dir:jdir,en:n('#jen'),sl:n('#jsl'),tp:n('#jtp'),rk:n('#jrk'),res:n('#jrs'),why:g('#jwhy').trim(),ex:g('#jex'),nt:g('#jnt').trim(),d:Date.now()});
db[ses].j=jr;persist();render()},
jdel(i){jr.splice(+i,1);db[ses].j=jr;persist();render()},
est(i){const k=me.st.indexOf(i);k<0?me.st.push(i):me.st.splice(k,1);$$('#ech .chip').forEach(b=>b.classList.toggle('on',me.st.includes(b.dataset.i)))},
psave(){const n=$('#enm').value.trim();if(!n){$('#eok').textContent='Имя не может быть пустым';return}
me.n=n;me.bio=$('#ebio').value.trim();persist();$('#eok').textContent='Сохранено';$('#eok').style.color='var(--v2)'},
out(){ses=null;me=null;jr=[];LS.s('almex_ses',null);setMode('L');show('auth')}};
$('#main').onclick=e=>{const b=e.target.closest('[data-a]');if(b)A_[b.dataset.a](b.dataset.i)};
$('#main').onchange=e=>{const t=e.target,f=t.files&&t.files[0];if(!f)return;
if(t.id==='pf'){pend={f,u:URL.createObjectURL(f)};$('#pn').textContent=f.name}
if(t.id==='pph')photo(f)};
$('#main').oninput=e=>{if(e.target.id==='fs'){const q=e.target.value.toLowerCase();$$('.fc').forEach(c=>c.hidden=!c.dataset.q.includes(q))}};
$('#main').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='cin')A_.send()};

</script>
</body>
</html>
